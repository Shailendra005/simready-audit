[project]
name = "simready-audit"
version = "0.1.0"
description = "Audit sim-ready 3D assets: USD/MJCF contract parity, geometry, physical plausibility and MuJoCo behaviour, with a self-validating mutation study."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [{ name = "Shailendrasinh Zala" }]
dependencies = [
  "mujoco==3.15.0",
  "usd-core==26.8",
  "trimesh==5.1.1",
  "manifold3d==3.5.4",
  "huggingface_hub==2.2.0",
  "coacd==1.0.14",
  "rtree==1.4.1",
  "numpy",
  "scipy",
  "pyyaml",
  "jinja2",
  "matplotlib",
  "networkx==3.5",
]

[project.scripts]
simready-audit = "simready_audit.cli:main"

[dependency-groups]
dev = ["pytest", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simready_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
